name: validate-intent-fixtures
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ajv:
    uses: heimgewebe/metarepo/.github/workflows/reusable-validate-jsonl.yml@9d985c3a426d387173d8753b09dd5175a242a7d5
    with:
      jsonl_paths_list: |
        fixtures/intent/*.jsonl
      schema_url: https://raw.githubusercontent.com/heimgewebe/metarepo/9c4caedec6f9e0fef4d1132838c8d8c24c0ba859/contracts/os.context.intent.schema.json
      strict: false
      validate_formats: true
