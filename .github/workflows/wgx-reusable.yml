name: WGX Reusable Workflow

on:
  workflow_call:
    inputs:
      run_metrics:
        type: boolean
        required: false
        default: false
      run_snapshot:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  push-index-e2e:
    name: Push-index E2E portability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked test environment
        run: uv sync --frozen --extra test
      - name: Verify push-index portability with port 8080 occupied
        env:
          INDEXD_E2E_HEALTHZ_DEADLINE: "120"
        run: uv run --frozen --extra test pytest -q tests/test_push_index_e2e.py

  wgx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { python-version: "3.11" }
      - uses: mikefarah/yq@v4

      - name: Create uv virtualenv
        run: uv venv

      - name: Install ruff
        run: uv pip install ruff

      - run: ./wgx/wgx smoke
      - run: ./wgx/wgx guard

      - if: ${{ inputs.run_metrics }}
        run: ./wgx/wgx metrics

      - name: Run Observatory (Mandatory)
        run: |
          mkdir -p artifacts
          ./wgx/wgx knowledge

      - name: Upload Observatory Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-report
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

      - if: ${{ inputs.run_snapshot }}
        run: ./wgx/wgx snapshot
