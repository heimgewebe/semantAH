name: Rust MSRV

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check workspace at MSRV
        run: cargo +1.88.0 check --workspace --locked
